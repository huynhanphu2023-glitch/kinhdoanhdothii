<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="coat" x1="67" y1="54" x2="177" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E5C878"/>
      <stop offset=".48" stop-color="#B99045"/>
      <stop offset="1" stop-color="#80602E"/>
    </linearGradient>
    <linearGradient id="lapel" x1="91" y1="72" x2="124" y2="145" gradientUnits="userSpaceOnUse">
