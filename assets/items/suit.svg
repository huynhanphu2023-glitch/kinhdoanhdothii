  <!-- Nẹp áo -->
  <path d="M127 84v93" stroke="#72572D" stroke-width="3" opacity=".8"/>

  <!-- Cúc áo -->
  <circle cx="137" cy="130" r="3.5" fill="#F5E3A6"/>
  <circle cx="137" cy="151" r="3.5" fill="#F5E3A6"/>
  <circle cx="137" cy="172" r="3.5" fill="#F5E3A6"/>

