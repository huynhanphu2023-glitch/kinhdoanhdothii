      <stop offset="1" stop-color="#C9D9D1"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="53" y1="104" x2="91" y2="183" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D7B864"/>
      <stop offset="1" stop-color="#98763A"/>
    </linearGradient>
    <filter id="shadow" x="30" y="38" width="181" height="190" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Bóng đổ -->
  <ellipse cx="121" cy="205" rx="72" ry="13" fill="#000" opacity=".28" filter="url(#shadow)"/>

  <!-- Móc treo -->
  <path d="M119 44c0-9 7-15 15-15 7 0 12 5 12 11 0 7-6 10-13 14"
