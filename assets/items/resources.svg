<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="crate-front" x1="73" y1="114" x2="122" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D5A85E"/>
      <stop offset="1" stop-color="#93653D"/>
    </linearGradient>
    <linearGradient id="crate-side" x1="122" y1="112" x2="175" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B98149"/>
      <stop offset="1" stop-color="#704936"/>
    </linearGradient>
    <linearGradient id="tile" x1="80" y1="73" x2="119" y2="111" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCE8D2"/>
      <stop offset="1" stop-color="#8BB8A2"/>
    </linearGradient>
    <filter id="shadow" x="35" y="35" width="173" height="186" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <ellipse cx="121" cy="204" rx="66" ry="12" fill="#000" opacity=".3" filter="url(#shadow)"/>

  <!-- Thân thùng chứa vật liệu -->
  <path d="m67 105 54 20v70l-54-22v-68Z"
        fill="url(#crate-front)" stroke="#65462F" stroke-width="3" stroke-linejoin="round"/>
  <path d="m121 125 53-21v69l-53 22v-70Z"
        fill="url(#crate-side)" stroke="#65462F" stroke-width="3" stroke-linejoin="round"/>

  <!-- Các thanh gỗ bên trái -->
  <path d="m74 101 12-24 48 17-13 24-47-17Z"
