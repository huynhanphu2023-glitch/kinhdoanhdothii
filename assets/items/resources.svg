  <!-- Tấm gạch ốp màu xanh -->
  <path d="m78 108 34-17 31 12-34 18-31-13Z"
        fill="url(#tile)" stroke="#50776C" stroke-width="2" stroke-linejoin="round"/>
  <path d="m78 108 31 13v13l-31-13v-13Z"
