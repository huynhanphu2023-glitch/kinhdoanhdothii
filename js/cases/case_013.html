var storyScreens = ["\u003csection class=\"screen\"\u003e\r\n\u003cdiv class=\"card\"\u003e\r\n\u003ch2\u003eGặp Đặng Minh Quân\u003c/h2\u003e\r\n\u003cp class=\"quote\"\u003e“Tôi không sợ người ta nghĩ tôi bán dữ liệu. Tôi sợ họ dùng một thứ giả để chứng minh một thứ thật.”\u003c/p\u003e\r\n\u003cp\u003eQuân xác nhận mình biết MODEL-RED tồn tại, nhưng phủ nhận việc cho phép bán dữ liệu hoặc tạo video.\u003c/p\u003e\r\n\r\n\u003cbutton onclick=\"addEvidence(\u0027E1358\u0027);next()\"\u003e\r\nGhi nhận lời khai Quân\r\n\u003c/button\u003e\r\n\u003c/div\u003e\r\n\u003c/section\u003e","\u003csection class=\"screen\"\u003e\r\n\u003cdiv class=\"card\"\u003e\r\n\u003ch2\u003ePhòng chứng cứ — lần 1\u003c/h2\u003e\r\n\r\n\u003cp\u003eLuật sư không được phép coi mọi vật chứng có giá trị ngang nhau.\u003c/p\u003e\r\n\r\n\u003cdiv class=\"grid\"\u003e\r\n\r\n\u003cdiv class=\"card doc\"\r\nonclick=\"addEvidence(\u0027E1302\u0027)\"\u003e\r\n\u003cb\u003eE1302\u003c/b\u003e\r\n\u003cp\u003eFile video gốc\u003c/p\u003e\r\n\u003c/div\u003e\r\n\r\n\u003cdiv class=\"card doc\"\r\nonclick=\"addEvidence(\u0027E1312\u0027)\"\u003e\r\n\u003cb\u003eE1312\u003c/b\u003e\r\n\u003cp\u003eLog CEO_ADMIN\u003c/p\u003e\r\n\u003c/div\u003e\r\n\r\n\u003cdiv class=\"card doc\"\r\nonclick=\"addEvidence(\u0027E1332\u0027)\"\u003e\r\n\u003cb\u003eE1332\u003c/b\u003e\r\n\u003cp\u003eRemote session\u003c/p\u003e\r\n\u003c/div\u003e\r\n\r\n\u003cdiv class=\"card doc\"\r\nonclick=\"addEvidence(\u0027E1336\u0027)\"\u003e\r\n\u003cb\u003eE1336\u003c/b\u003e\r\n\u003cp\u003eMODEL-RED\u003c/p\u003e\r\n\u003c/div\u003e\r\n\r\n\u003c/div\u003e\r\n\r\n\u003cbutton onclick=\"next()\"\u003eTiếp tục\u003c/button\u003e\r\n\u003c/div\u003e\r\n\u003c/section\u003e","\u003csection class=\"screen\"\u003e\r\n\u003cdiv class=\"card\"\u003e\r\n\u003ch2\u003eTimeline 01:42–02:35\u003c/h2\u003e\r\n\r\n\u003cp\u003e\r\n\u003cb\u003e01:42\u003c/b\u003e — Quân xuất hiện tại sân bay.\r\n\u003cbr\u003e\r\n\u003cb\u003e02:07\u003c/b\u003e — Remote session mở.\r\n\u003cbr\u003e\r\n\u003cb\u003e02:08\u003c/b\u003e — Một người đội mũ bước vào khu vực CEO.\r\n\u003cbr\u003e\r\n\u003cb\u003e02:13\u003c/b\u003e — CEO_ADMIN đăng nhập.\r\n\u003cbr\u003e\r\n\u003cb\u003e02:29\u003c/b\u003e — Remote session đóng.\r\n\u003cbr\u003e\r\n\u003cb\u003e02:35\u003c/b\u003e — Máy bay khởi hành.\r\n\u003c/p\u003e\r\n\r\n\u003cdiv class=\"quote\"\u003e\r\nMột tài khoản hoạt động có đồng nghĩa với việc chính chủ tài khoản đang sử dụng nó?\r\n\u003c/div\u003e\r\n\r\n\u003cbutton onclick=\"\r\naward(3);\r\nS.flags.add(\u0027account_person_separated\u0027);\r\naddEvidence(\u0027E1325\u0027);\r\naddEvidence(\u0027E1332\u0027);\r\nnext();\r\n\"\u003e\r\nTách tài khoản khỏi con người\r\n\u003c/button\u003e\r\n\r\n\u003cbutton onclick=\"\r\nS.trust-=8;\r\nS.flags.add(\u0027account_person_confused\u0027);\r\nnext();\r\n\"\u003e\r\nKết luận Quân trực tiếp đăng nhập\r\n\u003c/button\u003e\r\n\r\n\u003c/div\u003e\r\n\u003c/section\u003e","\u003csection class=\"screen\"\u003e\r\n\u003cdiv class=\"card\"\u003e\r\n\u003ch2\u003eGiám định video\u003c/h2\u003e\r\n\r\n\u003cp\u003e\r\nE1303 cho thấy video đã được xuất lại.\r\nE1304 chỉ lưu bản 720p.\r\nTrong khi bản được gửi báo chí lại là 4K.\r\n\u003c/p\u003e\r\n\r\n\u003cp\u003e\r\nĐiều này tạo ra một câu hỏi về nguồn video.\r\nNó chưa đủ để xác định người tạo video.\r\n\u003c/p\u003e\r\n\r\n\u003cbutton onclick=\"\r\naddEvidence(\u0027E1303\u0027);\r\naddEvidence(\u0027E1304\u0027);\r\naddEvidence(\u0027E1306\u0027);\r\naward(4);\r\nS.flags.add(\u0027video_chain\u0027);\r\nnext();\r\n\"\u003e\r\nKhóa chuỗi nguồn video\r\n\u003c/button\u003e\r\n\r\n\u003cbutton onclick=\"\r\nS.flags.add(\u0027video_overclaim\u0027);\r\nS.trust-=10;\r\nnext();\r\n\"\u003e\r\nTuyên bố video chắc chắn giả\r\n\u003c/button\u003e\r\n\r\n\u003c/div\u003e\r\n\u003c/section\u003e","\u003csection class=\"screen\"\u003e\r\n\u003cdiv class=\"card\"\u003e\r\n\u003ch2\u003eGiọng nói — 96,8% giống Quân\u003c/h2\u003e\r\n\r\n\u003cp\u003e\r\nChuyên gia xác định giọng trong video có mức tương đồng rất cao.\r\nNhưng đây không phải bài toán nhận dạng người nói đơn giản.\r\n\u003c/p\u003e\r\n\r\n\u003cdiv class=\"quote\"\u003e\r\n“Giọng giống Quân” không đồng nghĩa “Quân là người tạo file”.\r\n\u003c/div\u003e\r\n\r\n\u003cbutton onclick=\"\r\naddEvidence(\u0027E1310\u0027);\r\naddEvidence(\u0027E1311\u0027);\r\naward(4);\r\nS.flags.add(\u0027voice_limit_understood\u0027);\r\nnext();\r\n\"\u003e\r\nGiữ kết luận trong giới hạn giám định\r\n\u003c/button\u003e\r\n\r\n\u003cbutton onclick=\"\r\nS.flags.add(\u0027voice_equals_person\u0027);\r\nS.trust-=12;\r\nnext();\r\n\"\u003e\r\nĐồng nhất giọng với người thực hiện\r\n\u003c/button\u003e\r\n\r\n\u003c/div\u003e\r\n\u003c/section\u003e","\u003csection class=\"screen\"\u003e\r\n\u003cdiv class=\"card\"\u003e\r\n\u003ch2\u003eĐối chất Lâm Gia Bảo\u003c/h2\u003e\r\n\r\n\u003cp\u003e\r\nBảo từng bị NEXORA sa thải.\r\nVì vậy lời khai của anh ta có thể có động cơ trả đũa.\r\n\u003c/p\u003e\r\n\r\n\u003cp class=\"quote\"\u003e\r\nLần 1: “Tôi không biết gì.”\r\n\u003cbr\u003e\r\nLần 2: “Tôi từng làm việc với pipeline voice AI.”\r\n\u003c/p\u003e\r\n\r\n\u003cp\u003e\r\nHai lời khai không thể tự động được coi là thật hoặc giả.\r\nCần đối chiếu với tài liệu kỹ thuật.\r\n\u003c/p\u003e\r\n\r\n\u003cbutton onclick=\"\r\naddEvidence(\u0027E1353\u0027);\r\naddEvidence(\u0027E1354\u0027);\r\naddEvidence(\u0027E1337\u0027);\r\naward(5);\r\nS.flags.add(\u0027bao_cross_checked\u0027);\r\nnext();\r\n\"\u003e\r\nĐối chiếu lời khai với lịch sử MODEL-RED\r\n\u003c/button\u003e\r\n\r\n\u003cbutton onclick=\"\r\nS.flags.add(\u0027trust_bao_blindly\u0027);\r\nS.trust-=8;\r\nnext();\r\n\"\u003e\r\nTin toàn bộ lời khai Bảo\r\n\u003c/button\u003e\r\n\r\n\u003c/div\u003e\r\n\u003c/section\u003e","\u003csection class=\"screen\"\u003e\r\n\u003cdiv class=\"card\"\u003e\r\n\u003ch2\u003eCTO Vũ Khánh An — ngoại phạm\u003c/h2\u003e\r\n\r\n\u003cp\u003e\r\nK o cáo độc lập","description":"Chuyên gia ngoài kết luận video không đủ độ tin cậy để xác định người phát ngôn thật sự đã nói nội dung đó."}];
var introScreen = "<section class='screen'><div class='card'><span class='tag'>HỒ SƠ HÌNH SỰ KINH TẾ</span><h2>VỤ ÁN 013 — NGƯỜI KHÔNG TỒN TẠI</h2><p>Một vụ việc về AI, deepfake, dữ liệu cá nhân và chứng cứ điện tử. Mục tiêu không phải tìm một câu trả lời có sẵn, mà kiểm tra từng mắt xích trước khi kết luận.</p><div class='grid'><div><b>Bị can:</b> Đặng Minh Quân</div><div><b>Công ty:</b> NEXORA AI</div><div><b>Dữ liệu liên quan:</b> khoảng 4,8 triệu hồ sơ</div><div><b>Video nghi vấn:</b> 2 phút 17 giây</div></div><button type='button' onclick='next()'>Bắt đầu hồ sơ</button></div></section>";
var rulesScreen = "<section class='screen'><div class='card'><h2>Luật chơi</h2><p>Mỗi tài liệu có thể chứa dữ kiện thật, dữ kiện chưa đủ hoặc dữ kiện đánh lạc hướng. Thu thập chứng cứ, đối chiếu nguồn độc lập và giữ kết luận trong giới hạn mà chứng cứ cho phép.</p><div class='quote'>Tài khoản không đồng nghĩa với con người; khả năng kỹ thuật không tự chứng minh hành vi; sai phạm của công ty không tự động chứng minh ý chí của một cá nhân.</div><button type='button' onclick='next()'>Vào gặp bị can</button></div></section>";
var screens = [introScreen, rulesScreen].concat(storyScreens);
var badFlags = ["account_person_confused", "video_overclaim", "voice_equals_person", "trust_bao_blindly", "accept_an_alibi", "company_equals_ceo", "all_money_crime", "model_equals_creator", "log_absolute", "service_account_overclaim", "log_equals_person", "ip_equals_identity", "usb_equals_quan", "knowledge_equals_guilt", "proof_chain_jump", "third_party_overclaim", "intent_shortcut", "final_bad"];
var phaseNames = ["MỞ ĐẦU", "LUẬT CHƠI", "GẶP BỊ CAN", "PHÒNG CHỨNG CỨ", "TIMELINE", "VIDEO", "GIỌNG NÓI", "ĐỐI CHẤT BẢO", "CTO KHÁNH AN", "KHO DỮ LIỆU", "DÒNG TIỀN", "MODEL-RED", "LOG HỆ THỐNG", "ĐỐI CHẤT VY", "ĐỐI CHẤT HUY", "IP THỨ 17", "USB", "NHẬN THỨC", "CHUỖI CHỨNG CỨ", "GIẢ THUYẾT MỚI", "ĐỐI CHẤT CUỐI", "LẬP LUẬN CUỐI", "ĐÁNH GIÁ", "KẾT LUẬN"];
var state = { chapter: 0, score: 0, trust: 50, logic: 0, evidence: new Set(), flags: new Set(), history: [], started: Date.now() };
var app = document.getElementById("app");
var progress = document.getElementById("progress");
var phase = document.getElementById("phase");
var metrics = document.getElementById("caseMetrics");
var toast = document.getElementById("toast");
var evidenceDialog = document.getElementById("evidenceDialog");
var toastTimer;
var storageKey = "apx_s13";
function escapeHTML(value) { return String(value == null ? "" : value).replace(/[&<>"']/g, function (character) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character]; }); }
function notify(message) { toast.textContent = message; toast.style.display = "block"; clearTimeout(toastTimer); toastTimer = setTimeout(function () { toast.style.display = "none"; }, 2600); }
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify({ chapter: state.chapter, score: state.score, trust: state.trust, logic: state.logic, evidence: Array.from(state.evidence), flags: Array.from(state.flags), history: state.history, started: state.started })); }
  catch (error) { console.error("Could not save Case 13 progress.", error); notify("Tiến trình chưa lưu được trên thiết bị này."); }
}
function load() {
  try {
    var raw = localStorage.getItem(storageKey);
    if (!raw) return;
    var saved = JSON.parse(raw);
    if (!saved || typeof saved !== "object" || Array.isArray(saved)) throw new Error("Invalid saved Case 13 state.");
    state.chapter = Number.isInteger(saved.chapter) ? Math.max(0, Math.min(screens.length - 1, saved.chapter)) : 0;
    state.score = Number.isFinite(saved.score) ? saved.score : 0;
    state.trust = Number.isFinite(saved.trust) ? saved.trust : 50;
    state.logic = Number.isFinite(saved.logic) ? saved.logic : 0;
    state.evidence = new Set(Array.isArray(saved.evidence) ? saved.evidence.filter(function (id) { return evidenceCatalog.some(function (item) { return item.id === id; }); }) : []);
    state.flags = new Set(Array.isArray(saved.flags) ? saved.flags.filter(function (flag) { return typeof flag === "string"; }) : []);
    state.history = Array.isArray(saved.history) ? saved.history : [];
    state.started = Number.isFinite(saved.started) ? saved.started : Date.now();
  } catch (error) { console.error("Could not load Case 13 progress; starting a new case.", error); notify("Dữ liệu lưu Vụ án 13 bị lỗi; đã bắt đầu phiên mới."); }
}
function award(points) { var amount = Number(points) || 0; state.score += amount; state.logic += amount; }
function addEvidence(id) {
  var item = evidenceCatalog.find(function (candidate) { return candidate.id === id; });
  if (!item) { console.error("Unknown Case 13 evidence ID:", id); notify("Không tìm thấy vật chứng " + id + "."); return; }
  if (state.evidence.has(id)) { notify("Vật chứng " + id + " đã được ghi nhận."); return; }
  state.evidence.add(id); award(1); updateMetrics(); notify("Đã ghi nhận vật chứng: " + id);
}
function next() { if (state.chapter >= screens.length - 1) return; state.chapter += 1; save(); render(); }
function updateMetrics() { metrics.textContent = "Vật chứng " + state.evidence.size + "/" + evidenceCatalog.length + " · Logic " + state.logic; }
function finalResult() {
  var mistakes = badFlags.filter(function (flag) { return state.flags.has(flag); }).length;
  var ending;
  if (state.flags.has("final_good") && mistakes <= 1 && state.logic >= 25) ending = "KẾT THÚC A — Chuỗi buộc tội chưa đủ chắc để đồng nhất hoạt động số với hành vi trực tiếp của Quân. Luật sư đã tách tài khoản, thiết bị, dữ liệu, mô hình AI và ý chí của con người.";
  else if (state.logic >= 18 && mistakes <= 3) ending = "KẾT THÚC B — Hồ sơ cho thấy NEXORA có vấn đề nghiêm trọng về quản trị dữ liệu và quyền truy cập, nhưng trách nhiệm cá nhân của Quân vẫn cần được chứng minh bằng chứng cứ độc lập.";
  else if (state.logic >= 10) ending = "KẾT THÚC C — Có nhiều nghi vấn hợp lý nhưng chuỗi chứng cứ chưa được khóa. Một số kết luận đã đi xa hơn giới hạn của tài liệu.";
  else ending = "KẾT THÚC D — Hồ sơ bị suy luận quá nhanh. Người chơi đã nhầm giữa khả năng kỹ thuật, hoạt động của tài khoản và bằng chứng về người thực hiện.";
  var result = document.getElementById("result");
  if (result) result.textContent = "Điểm logic: " + state.logic + " · Độ tin cậy hồ sơ: " + Math.max(0, Math.min(100, state.trust)) + "% · Lỗi suy luận: " + mistakes;
  var conclusion = document.getElementById("ending");
  if (conclusion) conclusion.textContent = ending;
  var details = document.getElementById("endingDetails");
  if (details) details.innerHTML = "<div class='case-result-summary'>Đã ghi nhận " + state.evidence.size + "/" + evidenceCatalog.length + " vật chứng. Thời gian xử lý: " + Math.max(1, Math.round((Date.now() - state.started) / 60000)) + " phút. Lỗi suy luận đáng kể: " + mistakes + ".</div>";
}
function render() {
  app.innerHTML = screens[state.chapter] || screens[screens.length - 1];
  progress.style.width = Math.round(state.chapter / Math.max(1, screens.length - 1) * 100) + "%";
  phase.textContent = phaseNames[state.chapter] || "VỤ ÁN 013";
  updateMetrics();
  if (state.chapter >= screens.length - 2) finalResult();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function renderEvidenceCatalog() {
  var term = String(document.getElementById("evidenceSearch").value || "").trim().toLocaleLowerCase("vi-VN");
  var list = document.getElementById("evidenceList");
  list.innerHTML = evidenceCatalog.filter(function (item) { return !term || (item.id + " " + item.title + " " + item.description).toLocaleLowerCase("vi-VN").includes(term); }).map(function (item) {
    var found = state.evidence.has(item.id);
    return "<details class='evidence-item" + (found ? "" : " locked") + "'><summary>" + escapeHTML(item.id + " — " + item.title) + " · " + (found ? "Đã mở" : "Chưa mở") + "</summary><p>" + (found ? escapeHTML(item.description) : "Vật chứng sẽ mở theo diễn biến hồ sơ.") + "</p></details>";
  }).join("") || "<p class='muted'>Không tìm thấy vật chứng phù hợp.</p>";
}
function toggleEvidence(open) {
  var shouldOpen = typeof open === "boolean" ? open : !evidenceDialog.classList.contains("open");
  evidenceDialog.classList.toggle("open", shouldOpen);
  if (shouldOpen) { renderEvidenceCatalog(); document.getElementById("evidenceSearch").focus(); }
}
function resetCase() {
  try { localStorage.removeItem(storageKey); }
  catch (error) { console.error("Could not clear Case 13 progress.", error); notify("Không thể xóa tiến trình đã lưu."); return; }
  state = { chapter: 0, score: 0, trust: 50, logic: 0, evidence: new Set(), flags: new Set(), history: [], started: Date.now() };
  window.S = state;
  render();
}
window.next = next;
window.award = award;
window.addEvidence = addEvidence;
window.toggleEvidence = toggleEvidence;
window.resetCase = resetCase;
window.S = state;
load();
render();
})();
</script>
